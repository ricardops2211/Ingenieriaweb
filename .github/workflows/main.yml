name: Orquestador CERT

on:
  push:

permissions:
  contents: write

jobs:
  run-cert-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar Orquestador CERT
        shell: bash
        run: |
          echo "🚀 Orquestador CERT ejecutado automáticamente"
          echo "📌 ISSUE_KEY: ${{ github.event.head_commit.message }}"
          echo "🌿 BRANCH_NAME: ${{ github.ref_name }}"
